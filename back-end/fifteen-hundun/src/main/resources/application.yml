spring:
  profiles:
    active: dev
  application:
    name: fifteen-hundun
  datasource:
    url: ${fifteen-hundun.mysql.url}
    username: ${fifteen-hundun.mysql.username}
    password: ${fifteen-hundun.mysql.password}
    driver-class-name: ${fifteen-hundun.mysql.driver-class-name}

# JWT配置
jwt:
  secret: 5LiA5LqU6aaE6aWoY3JlYXRwZW4= # 密钥（建议至少32位）
  expiration: 3600 # 令牌过期时间（秒）

# 阿里云OSS配置
aliyun:
  endpoint: ${fifteen-hundun.alioss.endpoint}
  access-key-id: ${fifteen-hundun.alioss.access-key-id}
  access-key-secret: ${fifteen-hundun.alioss.access-key-secret}
  bucket-name: ${fifteen-hundun.alioss.bucket-name}
  domain: ${fifteen-hundun.alioss.domain}

#redis配置
redis:
  host: ${fifteen-hundun.redis.host}
  port: ${fifteen-hundun.redis.port}
  password: ${fifteen-hundun.redis.password}
  database: ${fifteen-hundun.redis.database}

