server:
  port: 5757
spring:
  profiles:
    active: dev
  application:
    name: fifteen-hundun
  datasource:
    url: ${fifteen-hundun.mysql.url}
    username: ${fifteen-hundun.mysql.username}
    password: ${fifteen-hundun.mysql.password}
    driver-class-name: ${fifteen-hundun.mysql.driver-class-name}
  data:
    redis:
      host: ${fifteen-hundun.redis.host}
      port: ${fifteen-hundun.redis.port}
      password: ${fifteen-hundun.redis.password}
      database: ${fifteen-hundun.redis.database}
      timeout: ${fifteen-hundun.redis.timeout}

## JWT配置
# 密钥只从环境变量 JWT_SECRET 读取（本地开发可写在 application-secret.yml）
# 密钥必须至少 32 字节，否则应用启动失败
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}
  mail:
    from: ${MAIL_FROM:luofengwuqi@qq.com}
    # 授权码只从环境变量 MAIL_AUTH_CODE 读取（本地开发可写在 application-secret.yml）
    auth-code: ${MAIL_AUTH_CODE:}
    smtp-host: ${MAIL_SMTP_HOST:smtp.qq.com}
  cors:
    # 允许携带凭证的跨域来源，多个用英文逗号分隔
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5577,http://127.0.0.1:5577}
  upload:
    # 单个文件最大字节数（默认 10MB）
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:10485760}
  security:
    # 只有部署在可信反向代理后面时才设为 true，否则 X-Forwarded-For 可被伪造
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}

# 阿里云OSS配置
# AccessKey 优先从环境变量读取，本地开发放在 application-secret.yml 中
aliyun:
  endpoint: ${fifteen-hundun.alioss.endpoint}
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:${fifteen-hundun.alioss.access-key-id:}}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:${fifteen-hundun.alioss.access-key-secret:}}
  bucket-name: ${fifteen-hundun.alioss.bucket-name}
  domain: ${fifteen-hundun.alioss.domain}


#mybatis配置
mybatis:
  # 开启驼峰命名自动转换（重点！）
  configuration:
    map-underscore-to-camel-case: true
  # 可选：指定Mapper.xml文件位置（如果用XML写SQL需要配）
  mapper-locations: classpath:com/createpen/fifteenhundun/module/*/mapper/*.xml
  # 可选：指定实体类别名包（简化XML里的类名）
#  type-aliases-package: com.createpen.fifteenhundun.module.user.pojo.Entity

