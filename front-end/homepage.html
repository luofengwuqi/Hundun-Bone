<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tlias智能学习辅助系统</title>
    <!-- 引用外部样式库（确保css文件与html文件在同一目录下） -->
    <link rel="stylesheet" href="tlias-style.css">
    <link rel="stylesheet" href="css/homepage.css">
</head>
<body>
<!-- 顶部导航 -->
<div class="header">
    <div class="header-title">Tlias智能学习辅助系统</div>
    <div class="header-right">
        <a href="#">修改密码</a>
        <span>|</span>
        <a href="#">退出登录 [宋江]</a>
    </div>
</div>

<!-- 主体容器 -->
<div class="container">
    <!-- 侧边栏 -->
    <div class="sidebar">
        <ul class="sidebar-menu">
            <li>首页</li>
            <li>班级学员管理</li>
            <li>系统信息管理</li>
            <li>数据统计管理</li>
        </ul>
    </div>

    <!-- 内容区 -->
    <div class="content">
        <div class="content-title">教学后台</div>
        <div class="content-subtitle">教学业务管理服务平台</div>

        <!-- 功能模块 + 示意图 -->
        <div class="modules">
            <!-- 左侧模块 -->
            <div class="module-group">
                <div class="module-item">
                    <div class="module-name">考务管理</div>
                    <div class="module-desc">阶段,升级,员工,社招类型的在线考试管理</div>
                </div>
                <div class="module-item">
                    <div class="module-name">教学数据</div>
                    <div class="module-desc">多维度教学数据的展示</div>
                </div>
                <div class="module-item">
                    <div class="module-name">反馈管理</div>
                    <div class="module-desc">多渠道反馈信息的管理</div>
                </div>
            </div>

            <!-- 中间示意图（用图片占位，可替换为实际插图） -->
            <div class="content-img">
                <img src="img/homepage.jpg"width="800">
            </div>

            <!-- 右侧模块 -->
            <div class="module-group">
                <div class="module-item">
                    <div class="module-name">教务管理</div>
                    <div class="module-desc">教师安排等教务工作的管理</div>
                </div>
                <div class="module-item">
                    <div class="module-name">就业管理</div>
                    <div class="module-desc">就业服务的相关管理</div>
                </div>
                <div class="module-item">
                    <div class="module-name">就业数据稽查</div>
                    <div class="module-desc">学员就业数据稽查管理</div>
                </div>
            </div>
        </div>-33
    </div>
</div>

<script>
    // 侧边栏菜单点击交互（示例：点击后高亮）
    const menuItems = document.querySelectorAll('.sidebar-menu li');
    menuItems.forEach(item => {
        item.addEventListener('click', () => {
            menuItems.forEach(i => i.style.background = '');
            item.style.background = '#e0e0e0';
        });
    });
</script>
</body>
</html>--
