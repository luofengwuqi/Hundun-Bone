<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <!-- 引入Bootstrap图标库（bi图标依赖） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/index-admin.css">
    <link rel="stylesheet" href="css/test.css">
</head>
<body>
<div class="app-container">
    <div class="nav">
        <a href="index.html" target="_blank" title="点击后将回到用户端首页">
            一五馄饨-管理端
        </a>
    </div>

    <!-- 主体容器（仅首页侧边栏+首页主内容，无其他页面相关内容） -->
    <div class="container-main">
        <!-- 侧边栏（仅首页相关导航，保留原有结构） -->
        <div class="sidebar">
            <ul class="sidebar-menu" id="sidebarMenu">
                <li class="menu-item active" data-target="homeContent">
                    <a href="test.html" style="text-decoration: none; color: inherit; display: block;">
                        <i class="bi bi-house-door"></i>首页
                    </a>
                </li>
                <li class="menu-item" data-target="userContent">
                    <a href="classstudent.html" style="text-decoration: none; color: inherit; display: block;">

                    </a>
                </li>
                <li class="menu-item" data-target="logContent">
                    <a href="#" style="text-decoration: none; color: inherit; display: block;">
                        <i class="bi bi-journal-text"></i>日志管理
                    </a>
                </li>
            </ul>
        </div>

        <!-- 首页主内容区（仅首页专属，无其他页面表格/按钮） -->
        <main class="home-main-content">
            <div class="home-content-tip">
                已进入系统首页，可通过左侧导航栏切换功能模块
            </div>
        </main>
    </div>
</div>
